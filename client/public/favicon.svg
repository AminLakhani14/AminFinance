<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Favicon variant: same mark, heavier strokes and a squarer tile so it
       survives being rendered at 16px in a browser tab. -->
  <defs>
    <linearGradient id="af-fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A93EC" />
      <stop offset="1" stop-color="#12469A" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10" fill="url(#af-fav)" />
  <path
    d="M10 37 L24 11 L38 37"
    fill="none"
    stroke="#fff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M17 28.5 H31" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
  <circle cx="24" cy="11" r="4.2" fill="#3DDC9A" />
</svg>
