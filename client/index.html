<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Portfolio tracking and analytics for stocks and crypto." />
    <title>AminFinance</title>
    <script>
      // Apply the stored theme before first paint. Without this the app flashes
      // the default dark shell before React hydrates the real preference.
      (function () {
        try {
          var stored = localStorage.getItem('aminfinance.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
