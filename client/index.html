<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Portfolio tracking and analytics for stocks and crypto." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#12469A" />
    <title>AminFinance</title>
    <script>
      // Apply the stored theme before first paint. Without this the app flashes
      // the default dark shell before React hydrates the real preference.
      (function () {
        try {
          var stored = localStorage.getItem('aminfinance.theme');
          // The cosmic interface is designed dark-first. A saved preference
          // still wins, and the in-app toggle keeps light mode available.
          var dark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
